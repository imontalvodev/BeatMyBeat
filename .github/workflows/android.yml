name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Tests y APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Mismo JDK que exige gradle/gradle-daemon-jvm.properties.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitarios (commonTest + androidUnitTest)
        run: ./gradlew :composeApp:testDebugUnitTest --stacktrace

      - name: APK debug
        run: ./gradlew :composeApp:assembleDebug --stacktrace

      - name: Informe de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/composeApp/build/reports/tests/
          retention-days: 7
